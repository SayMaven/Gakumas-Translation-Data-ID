stages:
  - validate
  - deploy

validate:
  stage: validate
  image: python:3.12-alpine
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - echo "Validating ADV resource syntax..."
    - python ./scripts/resource_validator.py ./local-files/resource

pages:
  stage: deploy
  image: python:3.12-alpine
  needs:
    - validate
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache zip
  script:
    - mkdir -p public
    # 1. Tentukan nomor versi (prioritas tag, fallback ke timestamp + hash)
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="$CI_COMMIT_TAG"
      else
        VERSION="$(date +'%Y%m%d.%H%M%S').main.${CI_COMMIT_SHORT_SHA}"
      fi
      echo "$VERSION" > version.txt
      echo "Publishing release version: $VERSION"

    # 2. Buat arsip ZIP khusus untuk Localify (local-files dan version.txt di root zip)
    - zip -r public/Gakumas-Translation-Data-ID.zip local-files version.txt

    # 3. Tentukan URL dasar GitLab Pages
    - PAGES_URL="${CI_PAGES_URL:-https://saymaven.gitlab.io/gakumas-translation-data-id}"

    # 4. Buat file latest.json berformat GitHub API untuk dibaca oleh plugin Localify game
    - |
      cat <<EOF > public/latest.json
      {
        "tag_name": "$VERSION",
        "name": "Rilis Data Terjemahan ID $VERSION",
        "assets": [
          {
            "name": "Gakumas-Translation-Data-ID.zip",
            "browser_download_url": "${PAGES_URL}/Gakumas-Translation-Data-ID.zip"
          }
        ]
      }
      EOF
    - echo "Release successfully created at ${PAGES_URL}/latest.json"
  artifacts:
    paths:
      - public
